name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mano
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: manosalwa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mano -d manosalwa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://mano:test-only@localhost:5432/manosalwa_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t manosalwaknot-api:ci backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e './backend[dev]'
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: python -c "from app.main import app; assert app.openapi()['info']['title']"
        working-directory: backend
      - name: Verify production container health
        run: |
          docker run --detach --name manosalwaknot-api \
            --network host \
            --env ENVIRONMENT=staging \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env JWT_SECRET="$JWT_SECRET" \
            --env PORT=8080 \
            manosalwaknot-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs manosalwaknot-api
          exit 1
      - run: pytest --cov=app --cov-report=term-missing
        working-directory: backend
