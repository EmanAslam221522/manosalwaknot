name: Mobile client checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify production web export
        run: npm run build:pwa
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_API_BASE_URL: https://api.example.com
