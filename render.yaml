services:
  - type: web
    name: manosalwaknot-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    dockerCommand: >-
      /bin/sh -c 'alembic upgrade head && exec uvicorn app.main:app
      --host 0.0.0.0 --port "${PORT:-8000}"'
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        sync: false
